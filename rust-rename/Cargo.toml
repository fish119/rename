[package]
name = "rename"
version = "1.0.0"
edition = "2024"

# 编译为 Windows GUI 应用（无控制台窗口）
[[bin]]
name = "rename"
path = "src/main.rs"

[dependencies]
# Windows API 绑定
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_IO",
] }

# GUI 库（轻量级即时模式 GUI）
eframe = "0.31"
egui = "0.31"

# 序列化
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# UUID 生成（用于临时文件名）
uuid = { version = "1.0", features = ["v4"] }

# 文件对话框
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
